name: AS03 Full Stack CI/CD

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  BACKEND_IMAGE: hdfcas03/as03-backend-2
  FRONTEND_IMAGE: hdfcas03/as03-frontend-2
  GATEWAY_IMAGE: hdfcas03/as03-gateway-2

jobs:
  # ==========================================
  # BACKEND CI & SECURITY (FastAPI)
  # ==========================================
  backend:
    name: Backend Build & Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AS-03-Backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: AS-03-Backend/requirements.txt

      - name: SAST & Quality Checks
        run: |
          python -m pip install --upgrade pip pip-tools
          pip install -r requirements.txt pytest bandit pip-audit
          pytest --junitxml=test-results.xml || true
          bandit -r . -f json -o bandit-report.json || true
          pip-audit --format json --output pip-audit-report.json || true

      - name: Upload Security & Test Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            AS-03-Backend/test-results.xml
            AS-03-Backend/bandit-report.json
            AS-03-Backend/pip-audit-report.json

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./AS-03-Backend
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ env.BACKEND_IMAGE }}:${{ github.sha }},${{ env.BACKEND_IMAGE }}:latest

      - name: Container Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.BACKEND_IMAGE }}:${{ github.sha }}"
          format: "table"
          exit-code: "0"
          severity: "HIGH,CRITICAL"

  # ==========================================
  # FRONTEND CI (React / Vite)
  # ==========================================
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AS-03-Frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - name: Install Dependencies & Build
        run: |
          npm ci
          npm run build

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./AS-03-Frontend
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }},${{ env.FRONTEND_IMAGE }}:latest

  # ==========================================
  # GATEWAY CI (OpenResty/Nginx)
  # ==========================================
  gateway:
    name: Gateway Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Build & Push Gateway Image
        uses: docker/build-push-action@v5
        with:
          context: ./AS-03-Backend/gateway
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ env.GATEWAY_IMAGE }}:${{ github.sha }},${{ env.GATEWAY_IMAGE }}:latest

  # ==========================================
  # DEPLOY TO EC2
  # ==========================================
  deploy:
    name: Deploy to EC2
    needs: [backend, frontend, gateway]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          printf '%s\n' "$SSH_PRIVATE_KEY" > /tmp/key.pem
          chmod 600 /tmp/key.pem
          ssh -i /tmp/key.pem \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=60 \
            $EC2_USER@$EC2_HOST << 'ENDSSH'
              set -e
              cd ~/CI-CD-pipeline/docker-compose

              # Pull latest images from DockerHub
              sudo docker pull hdfcas03/as03-backend-2:latest
              sudo docker pull hdfcas03/as03-frontend-2:latest
              sudo docker pull hdfcas03/as03-gateway-2:latest

              # Restart stack cleanly (avoids ContainerConfig bug in docker-compose v1)
              sudo docker-compose down
              sudo docker-compose up -d

              # Wait for containers to stabilize
              sleep 5

              # Health check
              echo "=== Container Status ==="
              sudo docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

              echo "=== Gateway Logs (last 20 lines) ==="
              sudo docker logs api-gateway --tail 20

              echo "=== Backend Logs (last 10 lines) ==="
              sudo docker logs backend --tail 10

              # Prune old images to save disk space
              sudo docker image prune -a -f

          ENDSSH
          rm -f /tmp/key.pem

      - name: Verify Deployment
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          # Wait for services to be ready
          sleep 10
          # Check health endpoint
          curl --fail --retry 3 --retry-delay 5 http://$EC2_HOST/health || echo "Health check failed - check logs"